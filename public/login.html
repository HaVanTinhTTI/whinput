<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TTI Scrap Management - Login</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #b5e61d, #9acd32);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-box {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      text-align: center;
      width: 320px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #007bff;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    .msg {
      color: red;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>🔐 Đăng nhập hệ thống</h2>
    <input type="email" id="email" placeholder="Email" required />
    <input type="password" id="password" placeholder="Mật khẩu" required />
    <button id="loginBtn">Đăng nhập</button>
    <div class="msg" id="msg"></div>
  </div>

  <script>
    const supabaseUrl = "https://rxudyeiwkfboztlflcxx.supabase.co";
    const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ4dWR5ZWl3a2Zib3p0bGZsY3h4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIyNjU3NTQsImV4cCI6MjA3Nzg0MTc1NH0.wACtZu-QbGHRtVzJzJBqiJ_kbwWdbMyTbPYcmbZ9l_E";
    const supabase = supabasejs.createClient(supabaseUrl, supabaseKey);

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const msg = document.getElementById("msg");

    document.getElementById("loginBtn").addEventListener("click", async () => {
      msg.textContent = "";
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();

      const { data, error } = await supabase.auth.signInWithPassword({
        email, password
      });

      if (error) {
        msg.textContent = "❌ Sai thông tin đăng nhập.";
      } else {
        // Lưu token vào localStorage
        localStorage.setItem("sb_token", data.session.access_token);
        localStorage.setItem("user_email", email);
        window.location.href = "dashboard.html"; // chuyển sang trang chính
      }
    });

    // Nếu đã login rồi → vào thẳng dashboard
    (async () => {
      const { data } = await supabase.auth.getSession();
      if (data.session) {
        window.location.href = "dashboard.html";
      }
    })();
  </script>
</body>
</html>
